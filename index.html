
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --gold:#f7c948; --pink:#ff6b9d; --lav:#c77dff; --coral:#ff8c69;
  --char-h: 130px;   /* character height — change one place */
}
html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:'Caveat',cursive; user-select:none;
  cursor:none; touch-action:none;
  background:#000;
}

/* ─── CUSTOM CURSOR (hidden on mobile automatically) ─── */
#cursor {
  position:fixed; width:14px; height:14px; border-radius:50%;
  background:rgba(255,240,200,0.9); box-shadow:0 0 10px 3px rgba(255,240,200,0.5);
  pointer-events:none; z-index:999; transform:translate(-50%,-50%);
}
@media (hover:none) { #cursor { display:none; } html,body { cursor:auto; } }

/* ─── DARK SCENE ─── */
#dark-scene {
  position:fixed; inset:0; background:#000; z-index:100;
  transition:opacity 1.2s ease;
}
#flashlight { position:fixed; inset:0; pointer-events:none; z-index:101; }
#hint-text {
  position:fixed; bottom:18%; left:50%; transform:translateX(-50%);
  color:rgba(255,240,200,0.5); font-size:1.3rem;
  letter-spacing:0.06em; z-index:102; text-align:center;
  animation:pulse 2.5s ease-in-out infinite; pointer-events:none;
  white-space:nowrap;
}
@keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.8} }

#switch-btn {
  position:fixed; top:36%; right:18%;
  width:44px; height:76px;
  background:#1a1a1a; border:2px solid #333; border-radius:22px;
  cursor:pointer; z-index:103;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px;
  opacity:0; transition:opacity 0.3s, box-shadow 0.3s;
}
#switch-btn::after {
  content:''; width:26px; height:26px; border-radius:50%;
  background:#2a2a2a; border:2px solid #444; transition:background 0.3s;
}
#switch-btn.lit { border-color:var(--gold); box-shadow:0 0 18px var(--gold),0 0 40px rgba(247,201,72,.3); }
#switch-btn.lit::after { background:var(--gold); }
#switch-label {
  position:fixed; top:calc(36% + 84px); right:calc(18% - 10px);
  color:rgba(255,240,200,0.5); font-size:0.8rem;
  z-index:103; opacity:0; pointer-events:none; transition:opacity 0.3s;
}

/* ─── FLASH ─── */
#flash { position:fixed; inset:0; background:white; z-index:99; opacity:0; pointer-events:none; }

/* ─── BRIGHT SCENE ─── */
#bright-scene {
  position:fixed; inset:0; z-index:10;
  opacity:0; pointer-events:none; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
}
#bright-scene.visible { opacity:1; pointer-events:all; cursor:auto; }

/* Wall */
#wall {
  position:absolute; inset:0 0 30% 0;
  background:linear-gradient(170deg,#fde8c8 0%,#f9d9b0 55%,#f0c898 100%);
}
#wall::before {
  content:''; position:absolute; inset:0;
  background-image:
    radial-gradient(circle,rgba(255,107,157,0.07) 2px,transparent 2px),
    radial-gradient(circle,rgba(247,201,72,0.05) 1px,transparent 1px);
  background-size:40px 40px, 20px 20px;
  background-position:0 0, 10px 10px;
}
/* Floor */
#floor {
  position:absolute; bottom:0; left:0; right:0; height:30%;
  background:linear-gradient(180deg,#c9935a,#b07840);
  border-top:4px solid #9a6535;
}
#floor::before {
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 55px,rgba(0,0,0,0.04) 56px);
}

/* Balloons */
.balloon {
  position:absolute; bottom:29%;
  width:48px; height:64px;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  opacity:0; transition:opacity 0.7s ease 1s;
  animation:balloonFloat 3s ease-in-out infinite;
  z-index:15;
}
.balloon::after { content:''; position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); width:1.5px; height:14px; background:#aaa; }
#bright-scene.visible .balloon { opacity:0.85; }
.balloon:nth-child(1){ left:3%;  background:var(--pink);  animation-delay:0s; }
.balloon:nth-child(2){ left:10%; background:var(--gold);  animation-delay:0.5s; }
.balloon:nth-child(3){ right:4%; background:var(--lav);   animation-delay:0.3s; }
.balloon:nth-child(4){ right:11%;background:var(--coral); animation-delay:0.8s; }
@keyframes balloonFloat { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-12px) rotate(3deg)} }

/* Banner */
#room-banner {
  position:absolute; top:4%; left:50%; transform:translateX(-50%);
  width:92vw; display:flex; justify-content:center;
  opacity:0; transition:opacity 0.8s ease 0.3s; z-index:20;
}
#bright-scene.visible #room-banner { opacity:1; }
#banner-string { position:absolute; top:10px; left:0; right:0; height:2px; background:#a0522d; }
.banner-flag {
  width:28px; height:22px;
  clip-path:polygon(0 0,100% 0,50% 100%);
  margin:0 2px;
  animation:flagWave 2.2s ease-in-out infinite;
}
.banner-flag:nth-child(even) { animation-delay:0.35s; }
@keyframes flagWave { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

/* Title */
#room-title {
  position:absolute; top:13%; left:50%;
  transform:translateX(-50%) translateY(-15px);
  text-align:center; z-index:20; opacity:0;
  transition:opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
  width:90vw;
}
#bright-scene.visible #room-title { opacity:1; transform:translateX(-50%) translateY(0); }
#room-title h1 {
  font-family:'Playfair Display',serif;
  font-size:clamp(2.2rem,9vw,3.6rem);
  color:#7a3030; line-height:1.1;
  text-shadow:2px 2px 0 rgba(255,107,157,0.2);
}
#room-title h1 span { color:var(--pink); font-style:italic; }
#room-title .subtitle { font-size:1rem; color:#b5735a; letter-spacing:0.14em; margin-top:3px; }

/* ─── CHARACTERS — z-index 22, behind table ─── */
#characters {
  position:absolute;
  bottom:29%;                /* align with table bottom area */
  left:50%; transform:translateX(-50%);
  display:flex;
  gap:3px;
  align-items:flex-end;
  z-index:22;
  width:96vw;
  justify-content:center;
  pointer-events:none;
}
.character {
  display:flex; align-items:flex-end; justify-content:center;
  flex:0 0 auto; max-width:15vw;
  opacity:0; transform:translateY(50px);
  transition:opacity 0.5s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  overflow: visible;
}
.char-img {
  /* fixed height so everyone is same size */
  height:300px;
  width:auto;
  max-width:100%;
  object-fit:contain;
  object-position:bottom center;
  /* remove black background */
  mix-blend-mode:multiply;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.25));
  animation:sway 2.8s ease-in-out infinite;
}
/* multiply won't work well on dark chars — use screen instead for the camo guy */
.char-img.light-char { mix-blend-mode:normal; }

.character:nth-child(1) .char-img { animation-delay:0.0s; }
.character:nth-child(2) .char-img { animation-delay:0.3s; }
.character:nth-child(3) .char-img { animation-delay:0.6s; }
.character:nth-child(4) .char-img { animation-delay:0.9s; }
.character:nth-child(5) .char-img { animation-delay:1.2s; }
@keyframes sway { 0%,100%{transform:rotate(-2deg) translateY(0)} 50%{transform:rotate(2deg) translateY(-4px)} }

/* ─── TABLE — z-index 25, on top of characters ─── */
#table {
  position:absolute; bottom:29%;
  left:50%; transform:translateX(-50%) translateY(16px);
  width:88vw; z-index:25;
  opacity:0; transition:opacity 0.7s ease 1s, transform 0.7s ease 1s;
}
#bright-scene.visible #table { opacity:1; transform:translateX(-50%) translateY(0); }

#table-items {
  position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
  display:flex; align-items:flex-end; justify-content:center;
  gap:clamp(10px,3vw,22px); padding-bottom:4px;
}
.table-top {
  width:100%; height:10px;
  background:linear-gradient(180deg,#a0683a,#7d4e28);
  border-radius:8px 8px 3px 3px;
  box-shadow:0 4px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.table-legs { display:flex; justify-content:space-between; padding:0 20px; }
.table-leg {
  width:16px; height:20px;
  background:linear-gradient(180deg,#7d4e28,#5c3518);
  border-radius:0 0 3px 3px;
  box-shadow:2px 2px 5px rgba(0,0,0,0.2);
}

/* Cake */
#cake {
  font-size:3rem; opacity:0;
  transform:scale(0.3) translateY(0px);
  transition:opacity 0.6s ease 1.6s, transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.6s;
  animation:cakeGlow 2s ease-in-out infinite 2.6s; display:inline-block;
}
#bright-scene.visible #cake { opacity:1; transform:scale(1) translateY(0); }
@keyframes cakeGlow { 0%,100%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))} 50%{filter:drop-shadow(0 4px 18px rgba(247,201,72,.6))} }
.deco-item { font-size:1.8rem; opacity:0; transition:opacity 0.5s ease; }
#bright-scene.visible .deco-item { opacity:1; }

/* ─── LETTER CARRIER (x-minus guy) ─── */
#letter-carrier {
  position:fixed;
  bottom:20%;           /* same floor level as characters */
  left:-140px;          /* starts off-screen left */
  z-index:90;           /* above characters+table, below modal */
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  opacity:0;
  pointer-events:none;
  transition: none;
}
#letter-carrier.walk-in {
  opacity:1;
  pointer-events:all;
  animation:walkIn 1.4s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
}
@keyframes walkIn {
  0%   { left:-140px; }
  100% { left:6vw; }
}
#carrier-char {
  height:100px; width:auto;
  object-fit:contain;
  mix-blend-mode:normal;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  /* subtle bounce while walking */
  animation:carrierWalk 0.4s ease-in-out infinite;
}
#letter-carrier.walk-in #carrier-char {
  animation:carrierWalk 0.4s ease-in-out infinite;
}
@keyframes carrierWalk {
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-6px) rotate(1deg)}
}

/* Letter envelope held above his hand */
#held-letter {
  position:absolute;
  top:-38px; left:50%;
  transform:translateX(-20%) rotate(-8deg);
  font-size:2.2rem;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));
  animation:letterHeld 0.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes letterHeld { 0%,100%{transform:translateX(-20%) rotate(-8deg) translateY(0)} 50%{transform:translateX(-20%) rotate(-8deg) translateY(-5px)} }

/* Take it button */
#take-btn {
  margin-top:6px;
  background:var(--pink);
  color:white; border:none;
  border-radius:20px;
  padding:8px 20px;
  font-family:'Caveat',cursive;
  font-size:1.1rem; font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(255,107,157,0.5);
  opacity:0;
  transform:translateY(8px);
  transition:opacity 0.4s ease, transform 0.4s ease, background 0.2s;
  pointer-events:none;
  white-space:nowrap;
}
#take-btn.show { opacity:1; transform:translateY(0); pointer-events:all; }
#take-btn:active { background:#e0558a; transform:scale(0.95); }

/* carrier exit */
#letter-carrier.walk-out {
  animation:walkOut 0.8s ease-in forwards;
}
@keyframes walkOut {
  0%  { left:6vw; opacity:1; }
  100%{ left:-180px; opacity:0; }
}

/* ─── LETTER MODAL ─── */
#letter-modal {
  position:fixed; inset:0;
  background:rgba(60,10,40,0.6);
  backdrop-filter:blur(8px);
  z-index:500;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.5s ease;
}
#letter-modal.open { opacity:1; pointer-events:all; }
#letter-card {
  background:#fffaf4; border-radius:22px;
  padding:2rem 1.8rem;
  width:min(420px,88vw); max-height:78vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(80,20,50,0.45);
  border:2px solid rgba(255,107,157,0.25);
  position:relative;
  transform:scale(0.85) translateY(20px);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s;
}
#letter-modal.open #letter-card { transform:scale(1) translateY(0); }
#letter-close {
  position:absolute; top:12px; right:14px;
  background:none; border:none; font-size:1.4rem;
  cursor:pointer; color:#c9a; line-height:1;
}
#letter-close:active { color:var(--pink); }
#letter-emoji { text-align:center; font-size:2.2rem; margin-bottom:0.8rem; animation:bounce 1s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
#letter-text {
  font-size:1.2rem; color:#4a2240;
  line-height:1.9; text-align:center;
  white-space:pre-wrap; min-height:70px;
}
#cursor-blink {
  display:inline-block; width:2px; height:1em;
  background:var(--pink); margin-left:1px;
  vertical-align:text-bottom;
  animation:blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ─── CONFETTI ─── */
.confetti-piece { position:fixed; top:-20px; pointer-events:none; z-index:400; animation:cFall linear forwards; border-radius:2px; }
@keyframes cFall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 85%{opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
.streamer { position:fixed; top:0; pointer-events:none; z-index:399; width:3px; border-radius:2px; animation:sFall linear forwards; opacity:0.7; }
@keyframes sFall { 0%{transform:translateY(-80px);opacity:0.8} 100%{transform:translateY(110vh);opacity:0} }
.particle { position:fixed; pointer-events:none; z-index:12; border-radius:50%; opacity:0; animation:pDrift linear infinite; }
@keyframes pDrift { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:0.5} 90%{opacity:0.3} 100%{transform:translateY(-5vh) scale(1);opacity:0} }

/* audio btn */
#audio-btn { position:fixed; bottom:16px; right:16px; width:40px; height:40px; border-radius:50%; background:white; border:none; box-shadow:0 3px 10px rgba(0,0,0,0.15); font-size:1.2rem; cursor:pointer; z-index:300; display:none; align-items:center; justify-content:center; }
#audio-btn.show { display:flex; }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="flash"></div>

<!-- ═══ DARK SCENE ═══ -->
<div id="dark-scene">
  <div id="flashlight"></div>
  <div id="hint-text">It's too dark… find the switch 🔦</div>
  <button id="switch-btn" aria-label="Light switch"></button>
  <div id="switch-label">switch</div>
</div>

<!-- ═══ BRIGHT SCENE ═══ -->
<div id="bright-scene">
  <div id="wall"></div>
  <div id="floor"></div>

  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>

  <div id="room-banner">
    <div id="banner-string"></div>
    <div class="banner-flag" style="background:#ff6b9d"></div>
    <div class="banner-flag" style="background:#f7c948"></div>
    <div class="banner-flag" style="background:#c77dff"></div>
    <div class="banner-flag" style="background:#ff8c69"></div>
    <div class="banner-flag" style="background:#7fd1b9"></div>
    <div class="banner-flag" style="background:#ff6b9d"></div>
    <div class="banner-flag" style="background:#f7c948"></div>
    <div class="banner-flag" style="background:#c77dff"></div>
    <div class="banner-flag" style="background:#ff8c69"></div>
    <div class="banner-flag" style="background:#7fd1b9"></div>
    <div class="banner-flag" style="background:#ff6b9d"></div>
  </div>

  <div id="room-title">
    <h1>Happy <span>Birthday!</span> 🎉</h1>
    <div class="subtitle">★ a little something just for you ★</div>
  </div>

  <!-- CHARACTERS z-index:22 — behind table -->
  <!-- char1 (x-minus) is NOT here — he's the letter carrier -->
  <div id="characters">
    <div class="character" id="char2"><img class="char-img" src="g1.PNG" alt=""></div>
    <div class="character" id="char3"><img class="char-img" src="g2.PNG" alt=""></div>
    <div class="character" id="char4"><img class="char-img" src="g3.PNG" alt=""></div>
    <div class="character" id="char5"><img class="char-img" src="h1.PNG" alt=""></div>
    <div class="character" id="char6"><img class="char-img" src="h2.PNG" alt=""></div>
  </div>

  <!-- TABLE z-index:25 — on top -->
  <div id="table">
    <div id="table-items">
      <span class="deco-item" style="transition-delay:1.9s"></span>
      <div id="cake">🎂</div>
      <span class="deco-item" style="transition-delay:2.1s"></span>
    </div>
    <div class="table-top"></div>
    <div class="table-legs">
      <div class="table-leg"></div>
      <div class="table-leg"></div>
    </div>
  </div>

</div><!-- /bright-scene -->

<!-- ═══ LETTER CARRIER (x-minus guy walks in) ═══ -->
<div id="letter-carrier">
  <div id="held-letter">✉️</div>
  <img id="carrier-char" src="V.PNG" alt="letter carrier">
  <button id="take-btn">Take it</button>
</div>

<!-- ═══ LETTER MODAL ═══ -->
<div id="letter-modal">
  <div id="letter-card">
    <button id="letter-close">✕</button>
    <div id="letter-emoji">✉️</div>
    <div id="letter-text"></div>
  </div>
</div>

<audio id="birthday-audio" loop>
  <source src="hbda.mp3" type="audio/mpeg">
</audio>
<button id="audio-btn">🔊</button>

<script>
// ✏️ EDIT YOUR MESSAGE HERE
const BIRTHDAY_MESSAGE = `Happy Birthday Cutie! 🎉

May All your wishes come true.

Yeah idk what to write more :)

Wishing you the happiest day ever.` ;

// ── elements ──
const darkScene   = document.getElementById('dark-scene');
const flashlight  = document.getElementById('flashlight');
const switchBtn   = document.getElementById('switch-btn');
const switchLabel = document.getElementById('switch-label');
const brightScene = document.getElementById('bright-scene');
const flashEl     = document.getElementById('flash');
const cursorEl    = document.getElementById('cursor');
const carrier     = document.getElementById('letter-carrier');
const takeBtn     = document.getElementById('take-btn');
const letterModal = document.getElementById('letter-modal');
const letterText  = document.getElementById('letter-text');
const letterClose = document.getElementById('letter-close');
const audioEl     = document.getElementById('birthday-audio');
const audioBtn    = document.getElementById('audio-btn');

let revealed = false, letterOpened = false;

// ── flashlight / touch ──
function updateLight(x, y) {
  cursorEl.style.left = x + 'px';
  cursorEl.style.top  = y + 'px';
  flashlight.style.background =
    `radial-gradient(circle 130px at ${x}px ${y}px,
      rgba(255,240,200,0.24) 0%,
      rgba(255,240,200,0.10) 40%,
      transparent 68%)`;
  if (!revealed) {
    const r = switchBtn.getBoundingClientRect();
    const d = Math.hypot(x - (r.left+r.width/2), y - (r.top+r.height/2));
    switchBtn.style.opacity   = Math.max(0, 1 - d/160);
    switchLabel.style.opacity = Math.max(0, 1 - d/160) * 0.7;
    switchBtn.classList.toggle('lit', d < 90);
  }
}
document.addEventListener('mousemove', e => updateLight(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  e.preventDefault();
  updateLight(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('touchstart', e =>
  updateLight(e.touches[0].clientX, e.touches[0].clientY));

// ── switch ──
switchBtn.addEventListener('click',    triggerReveal);
switchBtn.addEventListener('touchend', triggerReveal);

function triggerReveal(e) {
  e.preventDefault();
  if (revealed) return;
  revealed = true;
  cursorEl.style.display = 'none';

  if (audioEl.querySelector('source')) {
    audioEl.play().catch(() => {});
    audioBtn.classList.add('show');
  }

  // flash white
  flashEl.style.transition = 'opacity 0.12s';
  flashEl.style.opacity = '1';

  setTimeout(() => {
    darkScene.style.opacity = '0';
    darkScene.style.pointerEvents = 'none';
    flashEl.style.transition = 'opacity 0.9s';
    flashEl.style.opacity = '0';
    setTimeout(() => darkScene.style.display = 'none', 1400);

    brightScene.classList.add('visible');
    document.body.style.cursor = 'auto';

    spawnConfetti(130);
    spawnParticles();
    revealCharacters();

    // letter carrier walks in after characters appear
    setTimeout(bringCarrier, 2800);
  }, 200);
}

// ── confetti ──
const COLORS = ['#f7c948','#ff6b9d','#c77dff','#ff8c69','#7fd1b9','#fff','#a8edea'];
function spawnConfetti(n) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const el = document.createElement('div');
    const c  = COLORS[Math.floor(Math.random() * COLORS.length)];
    if (Math.random() > 0.6) {
      el.className = 'streamer';
      el.style.cssText = `left:${Math.random()*100}vw;height:${25+Math.random()*55}px;background:${c};animation-duration:${1.4+Math.random()*1.8}s;animation-delay:${Math.random()*1.2}s`;
    } else {
      el.className = 'confetti-piece';
      const s = 5 + Math.random() * 9;
      el.style.cssText = `left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${c};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2.2+Math.random()*2.8}s;animation-delay:${Math.random()*1.2}s`;
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }, Math.random() * 800);
}

function spawnParticles() {
  const p = ['rgba(255,107,157,0.4)','rgba(247,201,72,0.35)','rgba(199,125,255,0.35)','rgba(127,209,185,0.4)'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div'); el.className = 'particle';
    const s = 5 + Math.random() * 12;
    el.style.cssText = `left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${p[Math.floor(Math.random()*p.length)]};animation-duration:${5+Math.random()*7}s;animation-delay:${Math.random()*3}s`;
    document.body.appendChild(el);
  }
}

// ── characters appear ──
function revealCharacters() {
  ['char2','char3','char4','char5','char6'].forEach((id, i) => {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }
    }, 1200 + i * 260);
  });
}

// ── letter carrier ──
function bringCarrier() {
  carrier.classList.add('walk-in');
  // show "take it" button after he arrives
  setTimeout(() => takeBtn.classList.add('show'), 1500);
}

takeBtn.addEventListener('click',    handleTake);
takeBtn.addEventListener('touchend', handleTake);

function handleTake(e) {
  e.preventDefault();
  if (letterOpened) return;
  letterOpened = true;
  takeBtn.classList.remove('show');

  // carrier walks back out
  carrier.classList.remove('walk-in');
  carrier.classList.add('walk-out');

  setTimeout(() => {
    letterModal.classList.add('open');
    setTimeout(startTyping, 400);
  }, 600);
}

letterClose.addEventListener('click', () => letterModal.classList.remove('open'));
letterModal.addEventListener('click', e => { if (e.target === letterModal) letterModal.classList.remove('open'); });

// ── typing effect ──
function startTyping() {
  const lines = BIRTHDAY_MESSAGE.trim().split('\n');
  let html = '', li = 0, ci = 0;
  letterText.innerHTML = '<span id="cursor-blink"></span>';

  function type() {
    if (li >= lines.length) {
      const c = document.getElementById('cursor-blink');
      if (c) c.remove();
      setTimeout(() => spawnConfetti(50), 200);
      return;
    }
    const line = lines[li];
    if (ci < line.length) {
      const ch = line[ci++];
      html += ch;
      letterText.innerHTML = html.replace(/\n/g,'<br>') + '<span id="cursor-blink"></span>';
      setTimeout(type, ch === ',' || ch === '.' ? 100 : 28);
    } else {
      html += '\n'; li++; ci = 0;
      setTimeout(type, 170);
    }
  }
  type();
}

// ── audio ──
audioBtn.addEventListener('click', () => {
  if (audioEl.paused) { audioEl.play(); audioBtn.textContent = '🔊'; }
  else { audioEl.pause(); audioBtn.textContent = '🔇'; }
});
</script>
</body>
</html>
